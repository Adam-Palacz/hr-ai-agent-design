version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: recruitment-ai:latest
    container_name: recruitment-ai-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # LLM provider selection
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}

      # Azure OpenAI (recommended for production)
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-https://openai-agentai-pl.openai.azure.com/}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_GPT_DEPLOYMENT=${AZURE_OPENAI_GPT_DEPLOYMENT:-gpt-4o-mini}
      - AZURE_OPENAI_VISION_DEPLOYMENT=${AZURE_OPENAI_VISION_DEPLOYMENT:-gpt-5-nano}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}

      # OpenAI (api.openai.com) – recommended for local/demo
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      # Email/SMTP
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.eu}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}

      # IMAP
      - IMAP_HOST=${IMAP_HOST:-imap.zoho.eu}
      - IMAP_PORT=${IMAP_PORT:-993}
      - EMAIL_CHECK_INTERVAL=${EMAIL_CHECK_INTERVAL:-60}
      - EMAIL_MONITOR_ENABLED=${EMAIL_MONITOR_ENABLED:-false}

      # Email routing
      - IOD_EMAIL=${IOD_EMAIL}
      - HR_EMAIL=${HR_EMAIL}

      # Qdrant
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-recruitment_knowledge_base}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERBOSE=${VERBOSE:-false}

      # CV parsing (see .env.example)
      - CV_PARSING_ENABLED=${CV_PARSING_ENABLED:-true}
      - CV_LLM_PARSING_ENABLED=${CV_LLM_PARSING_ENABLED:-true}

      # Flask (in Docker must listen on 0.0.0.0 to accept external connections)
      - FLASK_HOST=0.0.0.0
      - FLASK_DEBUG=false
    volumes:
      # Persystencja danych
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./qdrant_db:/app/qdrant_db
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - recruitment-network

  # Run tests inside the app image (no Qdrant needed; tests use mocks).
  # Usage: docker-compose run --rm app-test
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: recruitment-ai:latest
    environment:
      # Use dummy keys by default – tests mock LLM calls
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-test-key-no-real-calls}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-https://test.openai.azure.com/}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_GPT_DEPLOYMENT=${AZURE_OPENAI_GPT_DEPLOYMENT:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    command: pytest tests/ -v --cov=app --cov=config --cov=agents --cov=services --cov=routes --cov=database --cov-report=term-missing --cov-fail-under=40
    volumes:
      - ./data:/app/data
    profiles:
      - test

  qdrant:
    image: qdrant/qdrant:latest
    container_name: recruitment-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - recruitment-network

volumes:
  qdrant_storage:
    driver: local

networks:
  recruitment-network:
    driver: bridge
