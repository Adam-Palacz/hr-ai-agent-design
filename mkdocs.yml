site_name: Recruitment AI Documentation
site_description: Documentation for the recruitment AI assistant (HR feedback, email automation, RAG).
site_url: ""

nav:
  - Home: index.md
  - Overview:
      - Przegląd (PL): OVERVIEW_PL.md
      - Overview (EN): OVERVIEW_EN.md
  - Quickstart:
      - Pierwsze uruchomienie – nietechnicznie (PL): QUICKSTART_NONTECH_PL.md
      - First run – non-technical (EN): QUICKSTART_NONTECH_EN.md
      - Szybki start (PL): QUICKSTART_PL.md
      - Quickstart (EN): QUICKSTART_EN.md
  - User Guide:
      - Obsługa aplikacji (PL): USER_GUIDE_PL.md
      - Using the application (EN): USER_GUIDE_EN.md
  - Docker:
      - Uruchomienie w Dockerze (PL): DOCKER_PL.md
      - Docker guide (EN): DOCKER_EN.md
  - Architecture:
      - Architektura systemu (PL): ARCHITECTURE_PL.md
      - System architecture (EN): ARCHITECTURE_EN.md
  - Email:
      - Konfiguracja e‑mail (PL): EMAIL_SETUP_PL.md
      - Email setup (EN): EMAIL_SETUP_EN.md
  - API Reference:
      - Agents & Services: api.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
  - mermaid2

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

theme:
  name: material
