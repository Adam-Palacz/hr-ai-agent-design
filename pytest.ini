[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: integration tests (run with -m integration)
    evaluation: LLM evaluation tests (run with RUN_LLM_EVAL=1)
